# ============================================================
# App Platform — nginx configuration
# Place this in /etc/nginx/sites-available/app-platform
# Then: sudo ln -s /etc/nginx/sites-available/app-platform /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo nginx -s reload
# ============================================================

# Upstream: Next.js app running on port 3000 (via PM2)
upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── Platform Dashboard ─────────────────────────────────────────
# Replace platform.yourdomain.com with your actual platform domain
server {
    listen 80;
    listen [::]:80;
    server_name platform.yourdomain.com www.platform.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platform.yourdomain.com www.platform.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/platform.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDH+AESGCM:ECDH+AES256:ECDH+AES128:!DH+3DES:!ADH:!AECDH:!MD5;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # File upload limit (for product images etc.)
    client_max_body_size 20M;

    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ─── Tenant Custom Domains (catch-all) ──────────────────────────
# This catches ALL other domain names and routes them to the same
# Next.js app. Next.js middleware handles routing by Host header.
#
# For each new tenant custom domain, either:
# 1. Use this catch-all approach (wildcard SSL needed), OR
# 2. Run certbot for each domain individually (see below)

server {
    listen 80;
    listen [::]:80;
    # Catch all other domains
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# NOTE: For individual tenant SSL, use the script below instead of a catch-all SSL.
# The catch-all SSL block requires a wildcard cert which needs DNS challenge.
# Individual per-domain SSL is recommended for production.

# ─── Per-Tenant Domain Template ─────────────────────────────────
# Run this script for each new tenant domain (see deploy/add-domain.sh)
# It generates an nginx server block and runs certbot automatically.
